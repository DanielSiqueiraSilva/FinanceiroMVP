name: Validate Oceafin foundation
on:
  push:
    branches: [feature/oceafin-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint Oceafin design foundation
        run: npx eslint src/design/tokens.ts src/design/brand.tsx src/accessibility/useAccessibleStyles.ts src/app/_layout.tsx src/app/+html.tsx
      - name: Legacy full-repository lint audit (non-blocking)
        continue-on-error: true
        run: npm run lint
      - name: Backend unit tests
        run: node --test backend/tests/*.test.mjs
      - name: Expo Web build
        run: npm run build:web

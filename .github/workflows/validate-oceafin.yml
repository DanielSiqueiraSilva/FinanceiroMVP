name: Validate Oceafin UI
on:
  push:
    branches: [feature/oceafin-foundation, feature/oceafin-design-v2]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint Oceafin design foundation
        run: npx eslint src/design/tokens.ts src/design/brand.tsx src/accessibility/useAccessibleStyles.ts src/app/_layout.tsx src/app/+html.tsx src/components/navigation/OceanNavigation.tsx src/components/dashboard/OceanDashboard.tsx src/components/dashboard/dashboard-data.ts src/components/workspace/finance-flow-validation.ts src/design/OceanGlass.tsx src/components/dashboard/OceanHero.tsx src/components/dashboard/OceanFlowChart.tsx
      - name: Legacy full-repository lint audit (non-blocking)
        continue-on-error: true
        run: npm run lint
      - name: Backend unit tests
        run: node --test backend/tests/*.test.mjs
      - name: Dashboard selector tests
        run: node --experimental-strip-types --test tools/tests/oceafin-dashboard.test.mjs
      - name: Financial flow validation tests
        run: node --experimental-strip-types --test tools/tests/oceafin-finance-flow.test.mjs
      - name: Expo Web build
        run: npm run build:web
      - name: Install browser for visual preview
        run: |
          npm install --no-save --ignore-scripts playwright@1.65.0
          npx playwright install chromium --with-deps
      - name: Visual QA for Oceafin mock dashboard
        run: node tools/tests/oceafin-visual-audit.mjs
      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oceafin-visual-review
          path: visual-artifacts/
          if-no-files-found: ignore

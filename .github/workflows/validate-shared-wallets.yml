name: Validate shared wallets

on:
  push:
    branches:
      - feature/carteiras-chat-realtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate backend syntax
        run: |
          find backend/api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate backend tests
        run: |
          node --test backend/tests/*.test.mjs
          node --check backend/tests/shared-wallets.e2e.mjs
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Export Expo Web
        run: npm run build:web
